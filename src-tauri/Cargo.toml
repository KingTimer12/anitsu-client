[package]
name = "higanbana-client"
version = "0.1.0"
description = "Aplicativo desktop não oficial para navegar e baixar do acervo da Anitsu"
authors = ["Aaron King"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "higanbana_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["time", "sync", "fs", "io-util", "net", "macros", "rt-multi-thread"] }
tauri-plugin-http = { version = "2.8.3", features = ["json", "gzip", "brotli"] }
thiserror = "2"
sha2 = "0.10"
getrandom = "0.3"
tauri-plugin-libmpv = "0.3.2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
urlencoding = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
